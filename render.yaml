# Blueprint do Render: cria o banco PostgreSQL e a API (backend) de uma vez.
# No Render: New > Blueprint > selecione este repositório.
databases:
  - name: reservas-db
    plan: free
    databaseName: reservas
    user: reservas

services:
  - type: web
    name: reservas-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run db:deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: reservas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # o Render gera um segredo aleatório
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false # preencher com a URL da Vercel, ex.: https://reservas.vercel.app
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
